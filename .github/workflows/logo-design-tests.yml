name: Logo design toolkit tests
on:
  push:
    paths:
      - 'logo-design-chatgpt/**'
      - '.github/workflows/logo-design-tests.yml'
  pull_request:
    paths:
      - 'logo-design-chatgpt/**'
      - '.github/workflows/logo-design-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tools
        run: python -m compileall -q logo-design-chatgpt/scripts logo-design-chatgpt/tests
      - name: Run unit tests
        run: python -m unittest discover -s logo-design-chatgpt/tests -v
      - name: Validate starter catalog JSON
        run: python -m json.tool logo-design-chatgpt/assets/library/catalog.json > /dev/null
